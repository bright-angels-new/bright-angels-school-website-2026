name: Validate website code
on:
  push:
    branches: [bright-angels-rebuild]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check 'functions/api/[[path]].js'
      - name: Check required project files
        run: |
          test -s index.html
          test -s admin.html
          test -s styles.css
          test -s school-logo.jpg
          test -s wrangler.toml
