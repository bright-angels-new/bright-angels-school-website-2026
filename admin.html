<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Angels | Admin Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
    <a class="brand" href="/">
        <img src="/school-logo.jpg" alt="Bright Angels badge">
        <span>
            <strong>Bright Angels</strong>
            <small>Junior School</small>
        </span>
    </a>

    <a class="btn btn-gold" href="/" target="_blank" rel="noopener">
        Visit School Website ↗
    </a>
</header>

<main class="section admin-section">

    <div class="admin-intro">
        <p class="eyebrow">SCHOOL STAFF</p>
        <h2>Administrator Login</h2>
        <p>Sign in securely to manage school records.</p>
    </div>

    <div class="admin-login-card" id="loginCard">
        <form id="loginForm">
            <h3>Administrator login</h3>

            <label>
                Admin email
                <input name="email" type="email"
                    value="brightangels26@gmail.com" required>
            </label>

            <label>
                Password
                <input name="password" type="password"
                    required autocomplete="current-password">
            </label>

            <button class="btn btn-navy" type="submit">
                Sign in securely
            </button>

            <p class="form-status" id="loginStatus" role="status"></p>
        </form>

        <a class="text-link" href="/">
            ← Back to School Website
        </a>
    </div>

    <div id="adminPanel" class="admin-panel" hidden>

        <div class="admin-top">
            <div>
                <p class="eyebrow">ADMIN DASHBOARD</p>
                <h3>School records</h3>
            </div>

            <div class="admin-top-actions">
                <a class="btn btn-gold" href="/" target="_blank" rel="noopener">
                    Visit School Website ↗
                </a>

                <button class="btn btn-outline dark-outline" id="logoutBtn">
                    Sign out
                </button>
            </div>
        </div>

        <div class="admin-tabs" role="tablist">
            <button class="active" data-tab="students">Students</button>
            <button data-tab="subjects">Subjects</button>
            <button data-tab="marks">Record marks</button>
            <button data-tab="report-cards">Report Cards</button>
            <button data-tab="fees">Fees</button>
            <button data-tab="announcements">Announcements</button>
            <button data-tab="gallery">Photos</button>
            <button data-tab="design">Website Design</button>
            <button data-tab="applications">Applications</button>
            <button data-tab="messages">Messages</button>
        </div>

        <div id="adminContent" class="admin-content">
            <p>Choose a section to manage school records.</p>
        </div>

    </div>

</main>

<script src="/app.js" defer></script>

</body>
</html>
